<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 760" role="img" aria-label="AI 参与学习，判断权始终在人。">
  <rect width="1600" height="760" fill="#ffffff"/>
  <defs>
    <clipPath id="zh-line-one"><rect x="80" y="178" width="1440" height="190"/></clipPath>
    <clipPath id="zh-line-two"><rect x="80" y="365" width="1440" height="190"/></clipPath>
  </defs>
  <g fill="#525252" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="22" letter-spacing="5">
    <text x="82" y="76">BELLE LI / 以人为本的 AI / 2026<animate attributeName="opacity" from="0" to="1" dur="0.8s" begin="0.1s" fill="freeze"/></text>
    <text x="82" y="700">研究 / 设计 / 教学<animate attributeName="opacity" from="0" to="1" dur="0.8s" begin="0.8s" fill="freeze"/></text>
  </g>
  <line x1="82" y1="112" x2="1518" y2="112" stroke="#000000" stroke-opacity="0.12"/>
  <g fill="#000000" font-family="Inter, 'PingFang SC', 'Microsoft YaHei', Arial, sans-serif" font-weight="700" letter-spacing="-10">
    <g clip-path="url(#zh-line-one)"><text x="82" y="344" font-size="160">AI 参与学习，<animateTransform attributeName="transform" type="translate" from="0 190" to="0 0" dur="1s" begin="0.15s" calcMode="spline" keyTimes="0;1" keySplines="0.16 1 0.3 1" fill="freeze"/></text></g>
    <g clip-path="url(#zh-line-two)"><text x="82" y="532" font-size="150">判断权始终在人。<animateTransform attributeName="transform" type="translate" from="0 190" to="0 0" dur="1s" begin="0.38s" calcMode="spline" keyTimes="0;1" keySplines="0.16 1 0.3 1" fill="freeze"/></text></g>
  </g>
  <g transform="translate(1455 634)" stroke="#000000" fill="none" stroke-width="3">
    <circle cx="18" cy="18" r="17"/><path d="M10 18h16M18 10v16"/>
    <animateTransform attributeName="transform" additive="sum" type="rotate" from="0 18 18" to="360 18 18" dur="8s" repeatCount="indefinite"/>
  </g>
</svg>
